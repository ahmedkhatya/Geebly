<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جيبلي — اطلب من أي محل في العريش</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1DB954;
    --dark: #0a0a0a;
    --card: #141414;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(29,185,84,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 90% 80%, rgba(29,185,84,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 20px 60px;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeDown 0.6s ease both;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .logo-icon {
    width: 52px;
    height: 52px;
    background: var(--green);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 30px rgba(29,185,84,0.4);
  }

  .logo-text {
    font-size: 36px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -1px;
  }

  .logo-text span { color: var(--green); }

  .tagline {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.7;
  }

  .form-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px;
    animation: fadeUp 0.7s ease 0.1s both;
  }

  .form-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .form-title::before {
    content: '';
    width: 4px;
    height: 24px;
    background: var(--green);
    border-radius: 4px;
  }

  .field { margin-bottom: 20px; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  label span.req { color: var(--green); margin-right: 2px; }

  input, select, textarea {
    width: 100%;
    background: #1a1a1a;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    -webkit-appearance: none;
  }

  input::placeholder, textarea::placeholder { color: #444; }

  input:focus, select:focus, textarea:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(29,185,84,0.12);
  }

  textarea { resize: none; line-height: 1.7; }

  /* Location button */
  .location-btn {
    width: 100%;
    background: #1a1a1a;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--muted);
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    margin-bottom: 10px;
  }

  .location-btn:hover {
    border-color: var(--green);
    color: var(--green);
  }

  .location-btn.active {
    border-color: var(--green);
    border-style: solid;
    color: var(--green);
    background: rgba(29,185,84,0.08);
  }

  .location-status {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
    min-height: 18px;
  }

  .location-status.success { color: var(--green); }
  .location-status.error { color: #ff6b6b; }

  /* Save info checkbox */
  .save-info {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: rgba(29,185,84,0.06);
    border: 1.5px solid rgba(29,185,84,0.2);
    border-radius: 12px;
    cursor: pointer;
    margin-top: 8px;
  }

  .save-info input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--green);
    cursor: pointer;
    flex-shrink: 0;
  }

  .save-info-text {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  .save-info-text strong { color: var(--text); }

  /* Saved badge */
  .saved-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(29,185,84,0.15);
    border: 1px solid var(--green);
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    margin-right: 8px;
  }

  /* Categories */
  .categories {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .cat-btn {
    background: #1a1a1a;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    color: var(--muted);
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .cat-btn .emoji { font-size: 22px; }

  .cat-btn:hover { border-color: var(--green); color: var(--text); }

  .cat-btn.active {
    border-color: var(--green);
    background: rgba(29,185,84,0.1);
    color: var(--green);
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  .submit-btn {
    width: 100%;
    background: var(--green);
    color: #000;
    border: none;
    border-radius: 14px;
    padding: 18px;
    font-family: 'Cairo', sans-serif;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 28px;
    letter-spacing: 0.3px;
  }

  .submit-btn:hover {
    background: #22d860;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(29,185,84,0.35);
  }

  .submit-btn:active { transform: translateY(0); }

  .wa-note {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .success {
    display: none;
    text-align: center;
    padding: 20px 0;
    animation: fadeUp 0.5s ease both;
  }

  .success-icon {
    width: 80px;
    height: 80px;
    background: rgba(29,185,84,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin: 0 auto 20px;
    border: 2px solid var(--green);
  }

  .success h2 { font-size: 24px; font-weight: 900; margin-bottom: 10px; }
  .success p { color: var(--muted); line-height: 1.8; font-size: 15px; }

  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 12px;
    color: #444;
    animation: fadeUp 0.7s ease 0.2s both;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 36px;
    animation: fadeDown 0.6s ease 0.1s both;
  }

  .stat { text-align: center; }
  .stat-num { font-size: 22px; font-weight: 900; color: var(--green); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 400px) {
    .form-card { padding: 24px 20px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo">
      <div class="logo-icon">🛵</div>
      <div class="logo-text">جيب<span>لي</span></div>
    </div>
    <p class="tagline">اطلب من أي محل في العريش<br>ونوصّلك على طول</p>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">🕐 45</div>
      <div class="stat-label">دقيقة توصيل</div>
    </div>
    <div class="stat">
      <div class="stat-num">🏪 أي</div>
      <div class="stat-label">محل في العريش</div>
    </div>
    <div class="stat">
      <div class="stat-num">💚 24/7</div>
      <div class="stat-label">في خدمتك</div>
    </div>
  </div>

  <div class="form-card">
    <div id="formContent">
      <div class="form-title">اطلب دلوقتي</div>

      <!-- Name -->
      <div class="field">
        <label><span class="req">*</span> اسمك <span id="nameSavedBadge" class="saved-badge" style="display:none">✓ محفوظ</span></label>
        <input type="text" id="name" placeholder="اكتب اسمك هنا" />
      </div>

      <!-- Phone -->
      <div class="field">
        <label><span class="req">*</span> رقم موبايلك <span id="phoneSavedBadge" class="saved-badge" style="display:none">✓ محفوظ</span></label>
        <input type="tel" id="phone" placeholder="01X XXXX XXXX" />
      </div>

      <!-- Address -->
      <div class="field">
        <label><span class="req">*</span> عنوانك بالتفصيل <span id="addressSavedBadge" class="saved-badge" style="display:none">✓ محفوظ</span></label>

        <!-- Location button -->
        <button class="location-btn" id="locationBtn" onclick="getLocation()">
          <span>📍</span> تحديد موقعي تلقائياً من جوجل
        </button>
        <div class="location-status" id="locationStatus"></div>

        <input type="text" id="address" placeholder="أو اكتب عنوانك يدوياً..." />
      </div>

      <!-- Save info -->
      <label class="save-info" for="saveCheck">
        <input type="checkbox" id="saveCheck" onchange="toggleSave()" />
        <div class="save-info-text">
          <strong>احفظ بياناتي</strong><br>
          هيتذكر اسمك ورقمك وعنوانك المرة الجاية
        </div>
      </label>

      <div class="divider"></div>

      <!-- Category -->
      <div class="field">
        <label><span class="req">*</span> طلبك من إيه؟</label>
        <div class="categories">
          <button class="cat-btn" onclick="selectCat(this, 'مطعم')">
            <span class="emoji">🍔</span> مطعم
          </button>
          <button class="cat-btn" onclick="selectCat(this, 'خضار وفاكهة')">
            <span class="emoji">🥦</span> خضار
          </button>
          <button class="cat-btn" onclick="selectCat(this, 'صيدلية')">
            <span class="emoji">💊</span> صيدلية
          </button>
          <button class="cat-btn" onclick="selectCat(this, 'بقالة وسوبرماركت')">
            <span class="emoji">🛒</span> بقالة
          </button>
          <button class="cat-btn" onclick="selectCat(this, 'مخبز وحلويات')">
            <span class="emoji">🥖</span> مخبز
          </button>
          <button class="cat-btn" onclick="selectCat(this, 'غير ذلك')">
            <span class="emoji">📦</span> غيره
          </button>
        </div>
        <input type="hidden" id="category" />
      </div>

      <!-- Shop name -->
      <div class="field">
        <label>اسم المحل (لو عارفه)</label>
        <input type="text" id="shop" placeholder="مثال: مطعم الشاطئ، فرماسي النصر..." />
      </div>

      <!-- Order details -->
      <div class="field">
        <label><span class="req">*</span> تفاصيل الطلب</label>
        <textarea id="details" rows="4" placeholder="اكتب اللي عايزه بالتفصيل...&#10;مثال: كيلو طماطم + نصف كيلو بصل + علبة مياه"></textarea>
      </div>

      <!-- Notes -->
      <div class="field">
        <label>ملاحظات إضافية</label>
        <textarea id="notes" rows="2" placeholder="أي تفاصيل تانية عايزنا نعرفها..."></textarea>
      </div>

      <button class="submit-btn" onclick="submitOrder()">
        <span>🛵</span> ابعت الطلب
      </button>

      <div class="wa-note">
        <span>💬</span>
        هتوصلك رسالة تأكيد على الواتساب
      </div>
    </div>

    <div class="success" id="successMsg">
      <div class="success-icon">✅</div>
      <h2>تم الطلب!</h2>
      <p>استلمنا طلبك وهنتواصل معاك<br>على الواتساب في أقرب وقت 🛵</p>
    </div>
  </div>

  <div class="footer">
    جيبلي — العريش 🌴 | كل حاجة توصلك
  </div>

</div>

<script>
  let selectedCat = '';
  let locationCoords = null;

  // ── Load saved info on page load ──
  window.addEventListener('load', () => {
    const saved = JSON.parse(localStorage.getItem('geebly_user') || '{}');
    if (saved.name) {
      document.getElementById('name').value = saved.name;
      document.getElementById('nameSavedBadge').style.display = 'inline-flex';
    }
    if (saved.phone) {
      document.getElementById('phone').value = saved.phone;
      document.getElementById('phoneSavedBadge').style.display = 'inline-flex';
    }
    if (saved.address) {
      document.getElementById('address').value = saved.address;
      document.getElementById('addressSavedBadge').style.display = 'inline-flex';
    }
    if (saved.name || saved.phone || saved.address) {
      document.getElementById('saveCheck').checked = true;
    }
  });

  // ── Save / clear info ──
  function toggleSave() {
    const checked = document.getElementById('saveCheck').checked;
    if (!checked) {
      localStorage.removeItem('geebly_user');
      document.getElementById('nameSavedBadge').style.display = 'none';
      document.getElementById('phoneSavedBadge').style.display = 'none';
      document.getElementById('addressSavedBadge').style.display = 'none';
    }
  }

  // ── Get Location ──
  function getLocation() {
    const btn = document.getElementById('locationBtn');
    const status = document.getElementById('locationStatus');

    if (!navigator.geolocation) {
      status.textContent = '⚠️ جهازك مش بيدعم تحديد الموقع';
      status.className = 'location-status error';
      return;
    }

    btn.textContent = '⏳ جاري تحديد موقعك...';
    status.textContent = '';
    status.className = 'location-status';

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        locationCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const mapsLink = `https://maps.google.com/?q=${locationCoords.lat},${locationCoords.lng}`;

        // Put maps link in address field
        document.getElementById('address').value = mapsLink;

        btn.innerHTML = '✅ تم تحديد موقعك';
        btn.classList.add('active');
        status.innerHTML = `<a href="${mapsLink}" target="_blank" style="color:var(--green)">📍 افتح موقعك على الخريطة</a>`;
        status.className = 'location-status success';
      },
      (err) => {
        btn.innerHTML = '<span>📍</span> تحديد موقعي تلقائياً من جوجل';
        let msg = '⚠️ مش قادر يحدد موقعك';
        if (err.code === 1) msg = '⚠️ محتاج تسمح للموقع يوصل لموقعك';
        status.textContent = msg;
        status.className = 'location-status error';
      },
      { timeout: 10000, enableHighAccuracy: true }
    );
  }

  // ── Select Category ──
  function selectCat(btn, cat) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedCat = cat;
    document.getElementById('category').value = cat;
  }

  // ── Submit Order ──
  function submitOrder() {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const details = document.getElementById('details').value.trim();

    if (!name || !phone || !address || !selectedCat || !details) {
      alert('⚠️ من فضلك اكمل البيانات المطلوبة كلها');
      return;
    }

    // Save info if checkbox checked
    if (document.getElementById('saveCheck').checked) {
      localStorage.setItem('geebly_user', JSON.stringify({ name, phone, address }));
    }

    const shop = document.getElementById('shop').value.trim();
    const notes = document.getElementById('notes').value.trim();

    const locationLine = locationCoords
      ? `\n🗺️ الموقع: https://maps.google.com/?q=${locationCoords.lat},${locationCoords.lng}`
      : '';

    const msg = `🛵 *طلب جديد — جيبلي*\n\n👤 الاسم: ${name}\n📱 الموبايل: ${phone}\n📍 العنوان: ${address}${locationLine}\n\n🏪 النوع: ${selectedCat}${shop ? '\n🏬 المحل: ' + shop : ''}\n\n📋 التفاصيل:\n${details}${notes ? '\n\n📝 ملاحظات: ' + notes : ''}`;

    const waNumber = '966543705987';
    const waURL = `https://api.whatsapp.com/send?phone=${waNumber}&text=${encodeURIComponent(msg)}`;

    window.open(waURL, '_blank');

    document.getElementById('formContent').style.display = 'none';
    const s = document.getElementById('successMsg');
    s.style.display = 'block';
  }
</script>

</body>
</html>
